function render(t, lang) {
  document.getElementById("facts").innerHTML = t.facts.map(([n, l]) => `<span><b>${n}</b>${esc(l)}</span>`).join("");
  document.getElementById("legend").innerHTML = CATS.map(c => `<span class="c-${c}"><i></i>${esc(t.cat[c])}</span>`).join("");
  document.getElementById("chips").setAttribute("aria-label", t.filterAria);
  document.getElementById("chips").innerHTML = t.chips.map(([k, l]) => `<button class="chip" type="button" data-f="${k}" aria-pressed="${k === filter}">${esc(l)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => setFilter(c.dataset.f)));

  const strip = document.getElementById("strip"), list = document.getElementById("days");
  strip.innerHTML = ""; list.innerHTML = "";
  DAYS.forEach(day => {
    const c = day[lang], dow = t.dow[day.w], mon = t.mon[day.m];
    const b = document.createElement("button");
    b.type = "button"; b.className = `cell c-${day.cat}`;
    b.setAttribute("aria-label", `${dow} ${mon} ${day.d}: ${c.title}`);
    b.innerHTML = `<span>${esc(dow)}</span><span class="n">${day.d}</span><span class="t">${esc(c.tag)}</span>`;
    b.addEventListener("click", () => { setFilter("all"); document.getElementById(day.id).scrollIntoView({ block: "start" }); });
    strip.appendChild(b);

    const li = document.createElement("li");
    li.className = `day c-${day.cat}`; li.id = day.id; li.dataset.cat = day.cat;
    const guideHref = day.guide === "sky" ? "sky.html" : day.guide ? `parks.html#${day.guide}` : "";
    li.innerHTML = `
      <div class="date"><span>${esc(dow)}</span><span class="num">${day.d}</span><span>${esc(mon)}</span></div>
      <div class="dbody">
        <div class="where"><span class="tag">${esc(c.tag)}</span><span class="park">${esc(c.park)}</span>${c.iconic ? `<span class="iconic">★ ${esc(c.iconic)}</span>` : ""}${guideHref ? `<a class="guide" href="${guideHref}">${t.guide}</a>` : ""}</div>
        <h3>${esc(c.title)}</h3>
        <ul>${c.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
        ${c.note ? `<div class="note">${esc(c.note)}</div>` : ""}
        ${day.drive ? `<div class="drive">${esc(t.drive(day.drive))}</div>` : ""}
      </div>`;
    list.appendChild(li);
  });
  const empty = document.createElement("li");
  empty.className = "empty"; empty.id = "empty"; empty.textContent = t.empty;
  list.appendChild(empty);
  setFilter(filter);

  document.getElementById("dates").innerHTML = t.dates.map(([d, x]) => `<dt>${esc(d)}</dt><dd>${esc(x)}</dd>`).join("");
  const checksEl = document.getElementById("checks"); checksEl.innerHTML = "";
  CHECKS.forEach(item => {
    const [label, sub] = item[lang];
    const li = document.createElement("li");
    li.innerHTML = `<label class="check" for="chk-${item.id}"><input type="checkbox" id="chk-${item.id}" ${saved[item.id] ? "checked" : ""}><span class="cbox" aria-hidden="true"></span><span class="txt">${esc(label)}<small>${esc(sub)}</small></span></label>`;
    li.querySelector("input").addEventListener("change", e => { saved[item.id] = e.target.checked; Site.store.set(CHECK_KEY, JSON.stringify(saved)); progress(t); });
    checksEl.appendChild(li);
  });
  progress(t);
}
function progress(t) { document.getElementById("progress").textContent = t.progress(CHECKS.filter(c => saved[c.id]).length, CHECKS.length); }
function setFilter(f) {
  filter = f;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.f === f)));
  let shown = 0;
  document.querySelectorAll(".day").forEach(li => { const m = matches(li.dataset.cat, f); li.hidden = !m; if (m) shown++; });
  const e = document.getElementById("empty"); if (e) e.hidden = shown > 0;
}
Site.init(UI, render);
</script>
</body>
</html>
