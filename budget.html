<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Las Vegas Trip Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="site.css">
<script src="site.js"></script>
<style>
:root { --k-travel: var(--c-travel); --k-stay: var(--c-flex); --k-do: var(--c-zion); --k-food: var(--c-dv); --k-other: var(--c-sky); }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px 28px; }
.fig { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fig .lbl { font-size: 13px; color: var(--muted); }
.fig .num { font-family: var(--display); font-size: clamp(30px, 5vw, 40px); font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.fig.total .num { color: var(--accent); }
.fig .sub { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line); gap: 2px; }
.bar span { display: block; height: 100%; transition: flex-basis .25s ease; }
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
.blegend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.blegend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.blegend b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 32px; align-items: start; }
.controls { display: flex; flex-direction: column; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.controls h2, .items h2 { font-size: 20px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .flabel { font-size: 13px; font-weight: 600; }
.hint { font-size: 12px; color: var(--muted); }
select, input[type="number"] { width: 100%; font: 500 14px var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.money { position: relative; }
.money::before { content: "$"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }
.money input { padding-left: 22px; font-variant-numeric: tabular-nums; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tog { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 13.5px; cursor: pointer; }
.tog input { margin: 2px 0 0; width: 16px; height: 16px; accent-color: var(--accent); }
.reset { appearance: none; background: none; border: 0; padding: 0; color: var(--muted); font: 500 13px var(--body); text-decoration: underline; cursor: pointer; align-self: flex-start; }
.items { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
table.b { width: 100%; border-collapse: collapse; font-size: 14px; }
table.b th { text-align: left; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 0 8px 8px 0; border-bottom: 1px solid var(--line); }
table.b th.r, table.b td.r { text-align: right; padding-right: 0; padding-left: 12px; }
table.b td { padding: 10px 8px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.b td.r { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
table.b td .n { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
table.b td .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 8px; vertical-align: 1px; }
table.b tr.g td { padding-top: 16px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-bottom: 0; padding-bottom: 4px; }
table.b tfoot td { border-bottom: 0; font-weight: 700; font-size: 15px; padding-top: 12px; }
table.b tfoot td.r { font-family: var(--display); font-size: 20px; }
@media (max-width: 720px) { .grid { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <nav class="pnav" data-i18n-aria="navAria">
    <a data-nav="index.html" href="index.html" data-i18n="navItin"></a>
    <a data-nav="flights.html" href="flights.html" data-i18n="navFlights"></a>
    <a data-nav="parks.html" href="parks.html" data-i18n="navParks"></a>
    <a data-nav="food.html" href="food.html" data-i18n="navFood"></a>
    <a data-nav="sky.html" href="sky.html" data-i18n="navSky"></a>
    <a data-nav="budget.html" href="budget.html" aria-current="page" data-i18n="navBudget"></a>
    <a data-nav="ask.html" href="ask.html" data-i18n="navAsk"></a>
  </nav>

  <header class="top">
    <div class="toprow">
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <button class="lang" id="lang-toggle" type="button"></button>
    </div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
  </header>

  <section class="block" aria-label="Summary">
    <div class="summary">
      <div class="fig"><span class="lbl" data-i18n="figMsn"></span><span class="num" id="n-msn"></span><span class="sub" id="s-msn"></span></div>
      <div class="fig total"><span class="lbl" data-i18n="figGroup"></span><span class="num" id="n-group"></span><span class="sub" data-i18n="figGroupSub"></span></div>
    </div>
    <div class="bar" id="bar" role="img"></div>
    <div class="blegend" id="blegend"></div>
  </section>

  <div class="grid">
    <section class="controls" aria-labelledby="ctl-title">
      <h2 id="ctl-title" data-i18n="ctlTitle"></h2>
      <div class="field">
        <span class="flabel" data-i18n="flightLabel"></span>
        <div class="money"><input type="number" id="f-msn" min="0" step="10" inputmode="numeric" data-i18n-aria="flightLabel"></div>
        <span class="hint" data-i18n="fMsn"></span>
      </div>
      <div class="field">
        <span class="flabel" data-i18n="hotelLabel"></span>
        <div class="field"><label for="h-1" class="hint" data-i18n="h1"></label><div class="money"><input type="number" id="h-1" min="0" step="10" inputmode="numeric"></div></div>
        <div class="field"><label for="h-z" class="hint" data-i18n="hZ"></label><div class="money"><input type="number" id="h-z" min="0" step="10" inputmode="numeric"></div></div>
        <div class="field"><label for="h-2" class="hint" data-i18n="h2"></label><div class="money"><input type="number" id="h-2" min="0" step="10" inputmode="numeric"></div></div>
        <span class="hint" data-i18n="hotelHint"></span>
      </div>
      <div class="field">
        <label for="car" data-i18n="carLabel"></label>
        <div class="money"><input type="number" id="car" min="0" step="10" inputmode="numeric"></div>
      </div>
      <div class="field">
        <label for="entry" data-i18n="entryLabel"></label>
        <select id="entry"></select>
      </div>
      <div class="field">
        <label for="food" data-i18n="foodLabel"></label>
        <div class="money"><input type="number" id="food" min="0" step="5" inputmode="numeric"></div>
      </div>
      <button type="button" class="reset" id="reset" data-i18n="reset"></button>
    </section>

    <section class="items" aria-labelledby="items-title">
      <h2 id="items-title" data-i18n="itemsTitle"></h2>
      <div class="tablewrap">
        <table class="b">
          <thead><tr><th data-i18n="thItem"></th><th class="r" data-i18n="thPer"></th></tr></thead>
          <tbody id="rows"></tbody>
          <tfoot><tr><td data-i18n="footTotal"></td><td class="r" id="t-range"></td></tr></tfoot>
        </table>
      </div>
    </section>
  </div>

  <footer class="foot" data-i18n="footer"></footer>
</div>

<script>
const PEOPLE = 4, DAYS = 7, PARKING = 40;
// Hotel totals for 2 rooms with two beds each (Priceline, Nov 10, 2026): The D, Zion Park Motel, Downtown Grand.
const DEFAULTS = { fMsn: 463, h1: 379, hZ: 299, h2: 280, car: 729, entry: "have", food: 60 };
const ENTRY = { have: 0, pay: 70, pass: 80 };
const CATS = ["travel","stay","do","food"];
const UI = {
  en: {
    docTitle: "Las Vegas Trip Budget",
    eyebrow: "Dec 23 – 29, 2026 · 6 nights · 4 travelers from Madison",
    h1: "Trip budget",
    lede: "Estimated cost per person for the essentials: getting there, hotels, the car, park entry and food. Shared costs are split four ways. Optional extras like shows, tours and souvenirs aren’t included. Change the choices and the totals update.",
    figMsn: "Per person", figGroup: "Whole group", figGroupSub: "4 travelers",
    perDay: v => `about ${v} per day`,
    cat: { travel:"Flights & car", stay:"Hotel", do:"Park entry", food:"Food" },
    barAria: "Share of the average per-person cost by category",
    cheaper: "cheaper", ctlTitle: "Your choices",
    flightLabel: "Round-trip flight to Las Vegas", fMsn: "From Madison: United via O’Hare, 7:00 a.m. out and the 11:50 p.m. red-eye home ($463). The midday flight home is $516.",
    hotelLabel: "Hotels, 2 rooms, total per stay",
    h1: "Dec 23–26 · Las Vegas (3 nights)", hZ: "Dec 26 · Springdale for Zion (1 night)", h2: "Dec 27–28 · Las Vegas (2 nights)",
    hotelHint: "Two rooms with two beds each and free parking. Suggested: The D downtown ($379), Zion Park Motel ($299) and the Downtown Grand ($280), from Priceline. Check taxes and resort fees at checkout.",
    carLabel: "Rental car + gas, whole group",
    entryLabel: "National park entry",
    entryOpts: { have:"We have an America the Beautiful pass: $0", pay:"Pay at each park: $70 per car", pass:"Buy an America the Beautiful pass: $80" },
    foodLabel: "Food, per person per day",
    reset: "Reset to suggested values",
    itemsTitle: "Line by line", thItem: "Item", thPer: "Per person", footTotal: "Total per person",
    groups: { travel:"Getting there & around", stay:"Staying", do:"Parks", daily:"Day to day" },
    rows: {
      flight: ["Flight", "United Madison ⇄ Las Vegas via O’Hare, Dec 23 – 29, red-eye home"],
      car: ["Rental car + gas", v => `${v} for the group, split 4 ways. Costco Travel quote: Alamo intermediate SUV (Nissan Rogue AWD or similar), Dec 23 noon – Dec 29 10 p.m., $604 with taxes, unlimited miles, extra driver included; plus ~$125 gas for ~750 miles`],
      parking: ["Parking", "Strip and Sphere garages, split 4 ways"],
      hotel: ["Las Vegas hotels", (a, b, tot) => `Dec 23–26 ${a} + Dec 27–28 ${b} = ${tot} for 2 rooms, split 4 ways`],
      zion: ["Springdale hotel (Zion)", "Dec 26, 2 rooms near the park entrance, split 4 ways"],
      entry: ["Park entry", "Death Valley and Zion, split 4 ways"],
      food: ["Food", v => `${v} a day × 7 days, prime rib included`],
    },
    range: (a, b) => a === b ? a : `${a} – ${b}`,
    footer: "Flights from Google Flights, hotels from Priceline and the car from Costco Travel, all checked Nov 10, 2026; gas and food are estimates. Your choices are saved only in your own browser.",
  },
  zh: {
    docTitle: "拉斯维加斯旅行预算",
    eyebrow: "2026年12月23–29日 · 6晚 · 4人从麦迪逊出发",
    h1: "旅行预算",
    lede: "每人基本花费预估：交通、酒店、租车、公园门票和餐饮。共同费用四人平摊。演出、导览、纪念品等可选花费不计入。修改选项，总额会随之更新。",
    figMsn: "每人", figGroup: "四人合计", figGroupSub: "4人",
    perDay: v => `约每天 ${v}`,
    cat: { travel:"机票和租车", stay:"酒店", do:"公园门票", food:"餐饮" },
    barAria: "人均花费按类别的占比",
    cheaper: "更便宜", ctlTitle: "你的选择",
    flightLabel: "往返拉斯维加斯机票", fMsn: "从麦迪逊：美联航经奥黑尔转机，早上7:00去、晚上11:50红眼回（$463）。中午回程是$516。",
    hotelLabel: "酒店，两间房，每段合计",
    h1: "12月23–26日 · 拉斯维加斯（3晚）", hZ: "12月26日 · 斯普林代尔（锡安，1晚）", h2: "12月27–28日 · 拉斯维加斯（2晚）",
    hotelHint: "两间房、每间两张床、免费停车。建议：市中心的The D（$379）、Zion Park Motel（$299）和Downtown Grand（$280），Priceline价格。结账时确认税费和度假村费。",
    carLabel: "租车 + 油费，四人合计",
    entryLabel: "国家公园门票",
    entryOpts: { have:"已有美丽美国年票：$0", pay:"每个公园单独付：每车共$70", pass:"买一张美丽美国年票：$80" },
    foodLabel: "餐饮，每人每天",
    reset: "恢复建议值",
    itemsTitle: "明细", thItem: "项目", thPer: "每人", footTotal: "每人合计",
    groups: { travel:"交通", stay:"住宿", do:"公园", daily:"日常" },
    rows: {
      flight: ["机票", "美联航麦迪逊 ⇄ 拉斯维加斯，经奥黑尔转机，12月23–29日，红眼回程"],
      car: ["租车 + 油费", v => `四人合计 ${v}，平摊。Costco Travel报价：Alamo中型SUV（日产Rogue四驱或同级），12月23日中午–29日晚上10点，含税$604，不限里程，含额外驾驶人；加约1,200公里油费约$125`],
      parking: ["停车", "大道和Sphere停车楼，四人平摊"],
      hotel: ["拉斯维加斯酒店", (a, b, tot) => `12月23–26日 ${a} + 12月27–28日 ${b} = ${tot}，两间房，四人平摊`],
      zion: ["斯普林代尔酒店（锡安）", "12月26日，公园入口附近两间，四人平摊"],
      entry: ["公园门票", "死亡谷和锡安，四人平摊"],
      food: ["餐饮", v => `每天 ${v} × 7天，含烤牛肋排`],
    },
    range: (a, b) => a === b ? a : `${a} – ${b}`,
    footer: "机票价格来自Google Flights、酒店价格来自Priceline、租车价格来自Costco Travel，均于2026年11月10日查询；油费和餐饮为估算。你的选择只保存在你自己的浏览器里。",
  },
};

const KEY = "vegas-trip-budget-v9"; // v9: red-eye home Dec 29, car to 10 p.m.
let state = { ...DEFAULTS };
try { const s = JSON.parse(Site.store.get(KEY) || "null"); if (s) state = { ...DEFAULTS, ...s }; } catch (e) {}
const $ = id => document.getElementById(id);
const money = v => "$" + Math.round(v).toLocaleString("en-US");
const num = v => { const n = Number(v); return Number.isFinite(n) && n >= 0 ? n : 0; };
const save = () => Site.store.set(KEY, JSON.stringify(state));
const INPUTS = [["f-msn","fMsn"],["h-1","h1"],["h-z","hZ"],["h-2","h2"],["car","car"],["food","food"]];
let T = null;

function compute() {
  const hotelTotal = num(state.h1) + num(state.h2);
  const c = {
    car: num(state.car) / PEOPLE, parking: PARKING / PEOPLE,
    hotel: hotelTotal / PEOPLE, zion: num(state.hZ) / PEOPLE,
    entry: (ENTRY[state.entry] ?? 70) / PEOPLE,
    food: num(state.food) * DAYS,
  };
  const sum = Object.values(c).reduce((a, b) => a + b, 0);
  const msn = sum + num(state.fMsn);
  const avgFlight = num(state.fMsn);
  const cats = { travel: avgFlight + c.car + c.parking, stay: c.hotel + c.zion, do: c.entry, food: c.food };
  return { c, msn, group: Math.round(msn) * PEOPLE, cats, hotelTotal };
}

function renderNumbers() {
  const t = T, r = compute(), c = r.c;
  $("n-msn").textContent = money(r.msn); $("s-msn").textContent = t.perDay(money(r.msn / DAYS));
  $("n-group").textContent = money(r.group);
  const total = Object.values(r.cats).reduce((a, b) => a + b, 0) || 1;
  $("bar").setAttribute("aria-label", t.barAria);
  $("bar").innerHTML = CATS.filter(k => r.cats[k] > 0).map(k => `<span style="flex:${r.cats[k] / total} 1 0;background:var(--k-${k})" title="${t.cat[k]} ${money(r.cats[k])}"></span>`).join("");
  $("blegend").innerHTML = CATS.filter(k => r.cats[k] > 0).map(k => `<span><i style="background:var(--k-${k})"></i>${t.cat[k]} <b>${Math.round(r.cats[k] / total * 100)}%</b></span>`).join("");

  const R = t.rows;
  const row = (cat, key, val, note) => `<tr><td><span class="dot" style="background:var(--k-${cat})"></span>${R[key][0]}${note ? `<span class="n">${note}</span>` : ""}</td><td class="r">${val}</td></tr>`;
  const g = n => `<tr class="g"><td colspan="2">${t.groups[n]}</td></tr>`;
  $("rows").innerHTML = [
    g("travel"),
    row("travel","flight", money(num(state.fMsn)), R.flight[1]),
    row("travel","car", money(c.car), R.car[1](money(num(state.car)))),
    row("travel","parking", money(c.parking), R.parking[1]),
    g("stay"),
    row("stay","hotel", money(c.hotel), R.hotel[1](money(num(state.h1)), money(num(state.h2)), money(r.hotelTotal))),
    row("stay","zion", money(c.zion), R.zion[1]),
    g("do"),
    row("do","entry", money(c.entry), `${t.entryOpts[state.entry]} · ${R.entry[1]}`),
    g("daily"),
    row("food","food", money(c.food), R.food[1](money(num(state.food)))),
  ].join("");
  $("t-range").textContent = money(r.msn);
}

function renderControls() {
  INPUTS.forEach(([id, k]) => { if (document.activeElement !== $(id)) $(id).value = state[k]; });
  $("entry").value = state.entry;
}

function render(t) {
  T = t;
  const sel = $("entry"); sel.innerHTML = "";
  Object.keys(ENTRY).forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = t.entryOpts[k]; sel.appendChild(o); });
  renderControls(); renderNumbers();
}

INPUTS.forEach(([id, k]) => {
  $(id).addEventListener("input", e => { state[k] = e.target.value === "" ? 0 : Number(e.target.value); save(); renderNumbers(); });
  $(id).addEventListener("blur", renderControls);
});
$("entry").addEventListener("change", e => { state.entry = e.target.value; save(); renderNumbers(); });
$("reset").addEventListener("click", () => { state = { ...DEFAULTS }; save(); renderControls(); renderNumbers(); });
Site.init(UI, render);
</script>
</body>
</html>
