const $ = id => document.getElementById(id);
const esc = Site.esc;
const money = v => "$" + Math.round(v).toLocaleString("en-US");
const rowCls = st => st === "pick" ? "hl" : st === "no" ? "dim" : "";
const status = (t, r) => `<span class="pill ${r.st}">${esc(t.st[r.st])}</span>${r.why ? `<span class="why">${esc(t.why[r.why])}</span>` : ""}`;

function leg(t, key) {
  const [al, a, b, dep, arr, via] = F[key];
  return `<span class="air">${esc(t.airline[al])}</span><span class="leg">${t.time(...dep)} → ${t.time(...arr)}</span><span class="ap">${a} → ${b}${via ? " · " + esc(t.via(via)) : ""}</span>`;
}

function combos(t) {
  const head = `<thead><tr><th>${t.th.go}</th><th>${t.th.back}</th><th class="r">${t.th.rt}</th><th class="r">${t.th.total}</th><th></th></tr></thead>`;
  const body = COMBOS.map(c => `<tr class="${rowCls(c.st)}">
      <td>${leg(t, c.go)}</td><td>${leg(t, c.back)}</td>
      <td class="pr" data-l="${esc(t.lblRt)}">${money(c.rt)}${c.two ? `<span class="sub">${esc(t.two)}</span>` : ""}</td>
      <td class="pr big" data-l="${esc(t.lblTotal)}">${money(c.rt + (c.bus ? BUS : 0))}${c.bus ? "" : `<span class="sub">${esc(t.noBus)}</span>`}</td>
      <td>${status(t, c)}</td></tr>`).join("");
  return head + `<tbody>${body}</tbody>`;
}

function table(t, rows, dir) {
  const head = `<thead><tr><th>${t.th.flight}</th><th>${t.th.dep}</th><th>${t.th.arr}</th><th class="r">${t.th.price}</th><th></th></tr></thead>`;
  const body = rows.map(r => {
    const route = dir === "out" ? `${r.from} → LAS` : `LAS → ${r.to}`;
    const sub = r.w ? `<span class="sub">${esc(t.withBack(money(r.w)))}</span>` : "";
    const two = r.two ? `<span class="sub">${esc(t.two)}</span>` : "";
    return `<tr class="${rowCls(r.st)}">
      <td><span class="air">${esc(t.airline[r.al])}</span><span class="ap">${route}</span></td>
      <td class="time">${t.time(...r.dep)}</td>
      <td class="time">${t.time(...r.arr)}${r.next ? `<small>${esc(t.next)}</small>` : ""}</td>
      <td class="pr">${money(r.p)}${dir === "out" ? sub : two}</td>
      <td>${status(t, r)}</td>
    </tr>`;
  }).join("");
  return head + `<tbody>${body}</tbody>`;
}

function render(t) {
  const pick = COMBOS.find(c => c.st === "pick"), msn = COMBOS.find(c => c.why === "cMsn");
  const card = (r, cls, priceTxt) => `<article class="route ${cls}">
      <div class="rk"><h3>${esc(r.name)}</h3><span class="pill ${cls.includes("best") ? "pick" : "na"}">${esc(r.tag)}</span></div>
      <div class="price">${priceTxt}</div>
      <div class="math">${esc(r.math)}</div>
      <ul>${r.pts.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
    </article>`;
  $("routes").innerHTML = card(t.rChi, "best c-travel", money(pick.rt + BUS)) + card(t.rMsn, "c-flex", money(msn.rt));
  $("combos").innerHTML = combos(t);
  $("out").innerHTML = table(t, OUT, "out");
  $("back").innerHTML = table(t, BACK, "back");
  $("msn").innerHTML = MSN.map(m => `<li><span>${esc(t.msn[m.k][0])}</span><b>${money(m.p)}</b><small>${esc(t.msn[m.k][1])}</small></li>`).join("");
  $("bus").innerHTML = t.bus.map(b => `<li>${esc(b)}</li>`).join("");
  $("tips").innerHTML = t.tips.map(b => `<li>${esc(b)}</li>`).join("");
}

Site.init(UI, render);
</script>
