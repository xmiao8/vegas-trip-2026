<style>
.jump { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 8px; }
.jump a { display: flex; flex-direction: column; gap: 1px; text-decoration: none; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); border-left: 4px solid var(--c); }
.jump a:hover { border-color: var(--c); }
.jump .d { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.jump .n { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
.places { display: flex; flex-direction: column; gap: 56px; }
.place { display: flex; flex-direction: column; gap: 18px; scroll-margin-top: 16px; }
.place + .place { border-top: 1px solid var(--line); padding-top: 48px; }
.phead { display: flex; flex-direction: column; gap: 6px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.when { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.place h2 { font-size: clamp(26px, 4.4vw, 36px); line-height: 1.1; }
.tagline { font-size: 17px; color: var(--muted); margin: 0; max-width: 60ch; }
.about { margin: 0; max-width: 68ch; }
.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stops { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.stops li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.stops li:last-child { border-bottom: 1px solid var(--line); }
.stops .sn { font-weight: 600; }
.stops .st { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; align-self: start; }
.stops .sd { grid-column: 1 / -1; font-size: 13.5px; color: var(--muted); }
.box section { display: flex; flex-direction: column; gap: 6px; }
.extras { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.extras h3 a { text-decoration: none; } .extras h3 a:hover { text-decoration: underline; }
.top { font-size: 13px; color: var(--muted); }
@media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr); } }
</style>

const ORDER = ["primerib","chinatown","cheap","buffets","road"];
const esc = Site.esc;
function render(t, lang) {
  const list = ORDER.map(id => PLACES.find(p => p.id === id));
  document.getElementById("jump").innerHTML = list.map(p => `<li class="c-${p.cat}"><a href="#${p.id}"><span class="d">${esc(p[lang].when)}</span><span class="n">${esc(p[lang].name)}</span></a></li>`).join("");
  document.getElementById("places").innerHTML = list.map(p => {
    const c = p[lang];
    const photo = p.img ? `<figure class="photo"><div class="frame"><img src="${IMG + p.img}" alt="${esc(c.name)}" loading="lazy" style="object-position:${p.pos}" onerror="this.closest('figure').classList.add('noimg')"><div class="ph" aria-hidden="true">${esc(c.name)}</div></div><figcaption>${t.photo}: <a href="${p.credit.page}" target="_blank" rel="noopener">${esc(p.credit.by)}</a>, <a href="${p.credit.licUrl}" target="_blank" rel="noopener">${p.credit.lic}</a>, via Wikimedia Commons</figcaption></figure>` : "";
    return `<article class="place c-${p.cat}" id="${p.id}" aria-labelledby="${p.id}-h">
      ${photo}
      <div class="phead"><div class="badges"><span class="tag">${esc(c.when)}</span></div><h2 id="${p.id}-h">${esc(c.name)}</h2><p class="tagline">${esc(c.tagline)}</p></div>
      <p class="about">${esc(c.about)}</p>
      <div class="cols">
        <div class="col"><h3>${t.hStops}</h3><ul class="stops">${c.stops.map(([n, tm, d]) => `<li><span class="sn">${esc(n)}</span><span class="st">${esc(tm)}</span><span class="sd">${esc(d)}</span></li>`).join("")}</ul></div>
        <div class="col">
          <div class="box"><section><h3>${t.hGood}</h3><ul>${c.good.map(g => `<li>${esc(g)}</li>`).join("")}</ul></section>
            <div class="links">${p.links.map(([l, u]) => `<a class="official" href="${u}" target="_blank" rel="noopener">${esc(l)} ↗</a>`).join("")}</div></div>
          <a class="top" href="#top">↑ ${t.top}</a>
        </div>
      </div>
    </article>`;
  }).join("");
}
Site.init(UI, render);
const target = location.hash.slice(1);
if (target && PLACES.some(p => p.id === target)) requestAnimationFrame(() => document.getElementById(target).scrollIntoView({ block: "start" }));
