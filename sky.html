<style>
.nights { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.night { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.night .nd { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.night h3 { font-size: 18px; }
.night .nk { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13.5px; }
.night .nk dt { color: var(--muted); }
.night .nk dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 600; }
.cloud { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 13.5px; }
.cloud .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.good { color: var(--good); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.na { color: var(--muted); } .pill.best { color: var(--accent); }
.cbar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.cbar span { display: block; height: 100%; background: var(--muted); }
.small { font-size: 12.5px; color: var(--muted); }
.outlook { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.oday { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; align-items: center; font-size: 12px; text-align: center; min-width: 0; }
.oday .ov { font-family: var(--display); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.oday .ocol { width: 100%; height: 48px; background: var(--line); border-radius: 4px; position: relative; overflow: hidden; }
.oday .ocol span { position: absolute; left: 0; right: 0; bottom: 0; background: var(--c-sky); opacity: .75; }
@media (max-width: 560px) { .outlook { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.sights { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.sight h3 { font-size: 16px; }
.sight .k { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
ol.tips { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; max-width: 70ch; }
</style>
</head>

      "2026-12-28": { title:"死亡谷——选项1", place:"火炉溪", rows:[["天黑","晚上6:12"],["月出","晚上10:25"],["星空","约4.2小时"]] },

      "2026-12-30": { title:"死亡谷——选项3（最暗）", place:"火炉溪", rows:[["天黑","晚上6:13"],["月出","凌晨12:33"],["星空","约6.3小时"]] },
    },
    dayLabel: d => new Date(d + "T12:00:00").toLocaleDateString("zh-CN", { weekday:"short", month:"long", day:"numeric" }),

    outlookTitle: "死亡谷未来7个晚上",
    outlookLede: "晚上6点到午夜的平均云量，实时更新。出发前你们要做的就是这样的检查。",
    moonTitle: "月亮与天黑时间，12月22日 – 1月1日",
    moonLede: "按火炉溪计算。“暗夜时长”是从完全天黑到月出的时间。山会让实际看到的月出晚10–30分钟，暗夜时间会稍微多一点。",
    moonHead: ["日期","日落","完全天黑","月出","月亮亮度","暗夜时长"],

      ["土星","天黑后在南–西南方高空","一颗稳定、偏黄的“星”。双筒望远镜里只是一个点，但很好找。"],
      ["木星","约晚上9–10点从东方升起","除了月亮外天空中最亮的天体。双筒望远镜拿稳了能看到最多四颗卫星的小亮点。"],
      ["火星","较晚时在东方，靠近木星","偏红，相当亮。"],

      ["昴星团","傍晚在东–东南方高处","一小团紧凑的星；用双筒望远镜看非常美。"],
      ["冬季银河","头顶偏东","比夏季银河暗，但在死亡谷眼睛适应后可以清楚看到。"],
    ],
    tipsTitle: "观星小贴士",

      "让眼睛在黑暗中适应20–30分钟，只用红光——看一眼白色手机屏幕就要重新适应。",

};
const LINKS = [
  ["Clear Outside — Death Valley","https://clearoutside.com/forecast/36.46/-116.87"],
  ["NWS forecast — Furnace Creek","https://forecast.weather.gov/MapClick.php?lat=36.46&lon=-116.87"],
  ["Windy — cloud layers","https://www.windy.com/36.46/-116.87?clouds,36.46,-116.87,8"],
  ["Death Valley conditions (NPS)","https://www.nps.gov/deva/planyourvisit/conditions.htm"],
];

const esc = Site.esc;
let fc = null, fcState = "loading", fcAt = null;

function ratingOf(v) { return v < 15 ? "good" : v < 35 ? "ok" : v < 65 ? "warn" : "bad"; }
const cls = { good:"good", ok:"good", warn:"warn", bad:"bad" };
function avgFor(pt, date, hours) {
  if (!fc || !fc[pt]) return null;
  const { time, cloud_cover, cloud_cover_high } = fc[pt];
  const idx = hours.map(h => time.indexOf(`${date}T${String(h).padStart(2, "0")}:00`)).filter(i => i >= 0);
  if (idx.length < hours.length) return null;
  const a = arr => Math.round(idx.reduce((s, i) => s + (arr[i] ?? 0), 0) / idx.length);
  return { all: a(cloud_cover), high: a(cloud_cover_high) };
}
const todayPT = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Los_Angeles" }).format(new Date());
const addDays = (d, n) => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00Z") - new Date(a + "T12:00:00Z")) / 864e5);

function render(t, lang) {
  const st = document.getElementById("fc-status");
  st.hidden = fcState === "ok"; st.textContent = fcState === "loading" ? t.loading : t.fail;
  document.getElementById("updated").textContent = fcState === "ok" && fcAt ? t.updated(fcAt.toLocaleString(lang === "zh" ? "zh-CN" : "en-US", { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" })) : "";

  const today = todayPT();
  const dvAvgs = NIGHTS.filter(n => n.kind === "stars").map(n => ({ n, a: avgFor(n.pt, n.date, n.hours) })).filter(x => x.a);
  let best = null;
  if (dvAvgs.length) best = dvAvgs.reduce((b, x) => (x.a.all < b.a.all - 5 || (Math.abs(x.a.all - b.a.all) <= 5 && x.n.dark > b.n.dark)) ? x : b).n.date;

  document.getElementById("nights").innerHTML = NIGHTS.map(n => {
    const c = t.nights[n.date], a = avgFor(n.pt, n.date, n.hours);
    let cloud;
    if (a) {
      const r = ratingOf(a.all), ahead = daysBetween(today, n.date);
      cloud = `<div class="row"><span>${t.cloudLabel}: <b>${a.all}%</b></span><span class="pill ${cls[r]}">${t.rating[r]}</span>${best === n.date ? `<span class="pill best">★ ${t.best}</span>` : ""}</div>
        <div class="cbar" aria-hidden="true"><span style="width:${a.all}%"></span></div>
        <span class="small">${a.high}% ${t.highLabel}${ahead > 7 ? " · " + t.rough : ""}</span>`;
    } else {
      cloud = `<div class="row"><span class="pill na">${esc(t.opens(t.dayLabel(addDays(n.date, -15))))}</span></div>`;
    }
    return `<div class="night c-${n.cat}"><span class="nd">${esc(t.dayLabel(n.date))} · ${esc(c.place)}</span><h3>${esc(c.title)}</h3>
      <dl class="nk">${c.rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      <div class="cloud">${cloud}</div></div>`;
  }).join("");

  const out = document.getElementById("outlook");
  if (fc && fc.dv) {
    out.innerHTML = Array.from({ length: 7 }, (_, i) => addDays(today, i)).map(d => {
      const a = avgFor("dv", d, [18,19,20,21,22,23]);
      const v = a ? a.all : null;
      return `<div class="oday"><span>${esc(t.dayLabel(d))}</span><div class="ocol" aria-hidden="true"><span style="height:${v ?? 0}%"></span></div><span class="ov">${v == null ? "–" : v + "%"}</span>${v == null ? "" : `<span class="pill ${cls[ratingOf(v)]}">${t.rating[ratingOf(v)]}</span>`}</div>`;
    }).join("");
  } else {
    out.innerHTML = `<p class="small">${esc(fcState === "loading" ? t.loading : t.fail)}</p>`;
  }

  document.getElementById("moon-head").innerHTML = t.moonHead.map(h => `<th>${esc(h)}</th>`).join("");
  document.getElementById("moon-rows").innerHTML = MOON.map(([d, ss, dk, mr, pct, hrs]) => {
    const hl = ["2026-12-23","2026-12-24","2026-12-28","2026-12-29","2026-12-30"].includes(d);
    return `<tr class="${hl ? "hl" : ""}"><td>${esc(t.dayLabel(d))}</td><td>${ss} pm</td><td>${dk} pm</td><td>${mr}</td><td>${pct}%</td><td>${hrs ? hrs.toFixed(1) + " h" : "—"}</td></tr>`;
  }).join("");

  document.getElementById("sights").innerHTML = t.sights.map(([n, k, d]) => `<div class="box sight"><h3>${esc(n)}</h3><span class="k">${esc(k)}</span><p>${esc(d)}</p></div>`).join("");
  document.getElementById("tips").innerHTML = t.tips.map(x => `<li>${esc(x)}</li>`).join("");
  document.getElementById("links").innerHTML = LINKS.map(([l, u]) => `<a href="${u}" target="_blank" rel="noopener">${esc(l)} ↗</a>`).join("");
}

const page = Site.init(UI, render);

(async () => {
  try {
    const c = JSON.parse(Site.store.get(CACHE_KEY) || "null");
    if (c && Date.now() - c.t < CACHE_MS && c.data) { fc = c.data; fcAt = new Date(c.t); fcState = "ok"; page.rerender(); return; }
  } catch (e) {}
  try {
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 12000);
    const r = await fetch(API, { signal: ctrl.signal }); clearTimeout(timer);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const arr = Array.isArray(j) ? j : [j];
    const keys = Object.keys(PTS);
    fc = {}; arr.forEach((loc, i) => { fc[keys[i]] = { time: loc.hourly.time, cloud_cover: loc.hourly.cloud_cover, cloud_cover_high: loc.hourly.cloud_cover_high }; });
    fcAt = new Date(); fcState = "ok";
    Site.store.set(CACHE_KEY, JSON.stringify({ t: Date.now(), data: fc }));
  } catch (e) { fcState = "fail"; }
  page.rerender();
})();
</script>
